[package]
name = "codenotch"
version = "0.1.0"
edition = "2021"
description = "AI coding usage limits (Claude, Codex, Kiro) for the Noctalia bar on Linux/Wayland"
license = "MIT"
repository = "https://github.com/JuanMCanchala/codenotch-noctalia"
authors = ["Juan Manuel Canchala"]

[dependencies]
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
