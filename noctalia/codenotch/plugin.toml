id          = "juanmcanchala/codenotch"
name        = "Codenotch"
version     = "0.2.0"
plugin_api  = 24
author      = "JuanMCanchala"
license     = "MIT"
icon        = "gauge"
description = "How much of your Claude (any number of accounts), Codex and Kiro limits is left, and whether Claude is working or waiting on you."
tags        = ["ai", "usage", "claude"]
dependencies = ["codenotch"]

[[setting]]
key             = "language"
type            = "select"
label_key       = "settings.language.label"
description_key = "settings.language.description"
default         = "auto"
options = [
  { value = "auto", label_key = "settings.language.auto" },
  { value = "en", label_key = "settings.language.en" },
  { value = "es", label_key = "settings.language.es" },
]

# Reads $XDG_RUNTIME_DIR/codenotch/state.json (written by `codenotch daemon`)
# and publishes it to the widget and the panel.
[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "usage"
entry = "widget.luau"

  [[widget.setting]]
  key             = "show_percent"
  type            = "bool"
  label_key       = "settings.show_percent.label"
  description_key = "settings.show_percent.description"
  default         = false

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 380
height          = 660
placement       = "floating"
open_near_click = true
